# Usar junto a compose.yaml; ver docs/metricas.md.
services:
    api:
        build:
            dockerfile: docker/api/Dockerfile
            args:
                IMAGEN_PHP: '${METRICAS_IMAGEN_PHP:-php:8.4-cli}'
        environment: &entorno-metricas
            METRICAS_HABILITADAS: 'true'
            METRICAS_DB_HOST: metricas-db
            METRICAS_DB_DATABASE: metricas
            METRICAS_DB_USERNAME: metricas_escritor
            METRICAS_DB_PASSWORD: '${METRICAS_ESCRITOR_PASSWORD:?Ejecuta node docker/metricas/preparar.mjs}'
            METRICAS_DB_SSLMODE: disable
            METABASE_URL: 'http://localhost:${METABASE_PORT:-3001}'
            METABASE_URL_INTERNA: 'http://metabase:3000'
            METABASE_SECRET_KEY: '${METABASE_SECRET_KEY:?Falta la clave de embedding}'
            METABASE_ADMIN_EMAIL: '${METABASE_ADMIN_EMAIL}'
            METABASE_ADMIN_PASSWORD: '${METABASE_ADMIN_PASSWORD}'
            METRICAS_LECTOR_PASSWORD: '${METRICAS_LECTOR_PASSWORD}'

    metricas-db:
        image: '${METRICAS_IMAGEN_POSTGRES:-postgres:17.10-alpine}'
        restart: unless-stopped
        environment:
            POSTGRES_DB: metabase
            POSTGRES_USER: metabase
            POSTGRES_PASSWORD: '${METRICAS_POSTGRES_PASSWORD:?Falta la contraseña PostgreSQL}'
            METRICAS_ESCRITOR_PASSWORD: '${METRICAS_ESCRITOR_PASSWORD}'
            METRICAS_LECTOR_PASSWORD: '${METRICAS_LECTOR_PASSWORD}'
        volumes:
            - metricas-postgres:/var/lib/postgresql/data
            - ./docker/metricas/inicializar.sh:/docker-entrypoint-initdb.d/10-metricas.sh:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U metabase -d metabase']
            interval: 5s
            timeout: 5s
            retries: 20

    metabase:
        image: '${METABASE_IMAGEN:-metabase/metabase:v0.64.3}'
        restart: unless-stopped
        ports:
            - '127.0.0.1:${METABASE_PORT:-3001}:3000'
        environment:
            MB_DB_TYPE: postgres
            MB_DB_HOST: metricas-db
            MB_DB_PORT: 5432
            MB_DB_DBNAME: metabase
            MB_DB_USER: metabase
            MB_DB_PASS: '${METRICAS_POSTGRES_PASSWORD}'
            MB_SITE_URL: 'http://localhost:${METABASE_PORT:-3001}'
            MB_SITE_LOCALE: es
            MB_REPORT_TIMEZONE: America/Bogota
            MB_ANON_TRACKING_ENABLED: 'false'
            MB_ENABLE_EMBEDDING: 'true'
            MB_EMBEDDING_SECRET_KEY: '${METABASE_SECRET_KEY}'
            MB_ENCRYPTION_SECRET_KEY: '${METABASE_ENCRYPTION_SECRET_KEY}'
            MB_EMBEDDING_APP_ORIGINS: 'http://localhost:5173,http://127.0.0.1:5173'
            JAVA_OPTS: '-Xmx768m'
        depends_on:
            metricas-db:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:3000/api/health']
            interval: 15s
            timeout: 5s
            retries: 30
            start_period: 120s

    metricas-planificador:
        build:
            context: .
            dockerfile: docker/api/Dockerfile
            args:
                IMAGEN_PHP: '${METRICAS_IMAGEN_PHP:-php:8.4-cli}'
        restart: unless-stopped
        volumes:
            - ./backend:/app
        environment:
            <<: *entorno-metricas
            DB_CONNECTION: sqlite
        # La API ya prepara dependencias y migraciones. No repetir su entrypoint.
        entrypoint: ['php', 'artisan']
        command: ['schedule:work', '--no-interaction']
        depends_on:
            api:
                condition: service_healthy
            metricas-db:
                condition: service_healthy

volumes:
    metricas-postgres:
